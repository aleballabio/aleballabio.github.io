<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<!-- Nothing here talks to a server: no connections, only this page, its QR helper and the fonts. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; manifest-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>Keyholder</title>
<!-- Home Screen app (iPhone and Android) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Keyholder">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* One narrow column on OLED black with a single brass accent, matching the Keyholder app. */
  :root {
    --bg: #000; --surface: #0e0f11; --surface2: #141518; --raised: #1a1b1e; --line: #222327; --line2: #2a2b2f;
    --text: #f2efe8; --muted: #b9b5ac; --dim: #8d897f;
    --brass: #e3b25e; --brass-hi: #f3cb82; --brass-deep: #15110a; --brass-line: #3a2e17; --on-brass: #120e06; --ok: #6fcf97;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --ease: cubic-bezier(.2,.8,.2,1);
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 400 16px/1.55 var(--body); overflow-x: hidden; }
  /* a slow warm glow behind everything, like light through a keyhole */
  body::before { content: ""; position: fixed; inset: -20% -30% auto; height: 70vh; pointer-events: none; z-index: 0;
    background: radial-gradient(closest-side, rgba(227,178,94,.16), transparent 70%); animation: drift 22s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translate(-12%, -4%) scale(1); } to { transform: translate(14%, 4%) scale(1.15); } }
  main { position: relative; z-index: 1; max-width: 30rem; margin: 0 auto; padding: calc(28px + env(safe-area-inset-top)) 22px calc(40px + env(safe-area-inset-bottom)); display: grid; gap: 18px; }
  .eyebrow { font: 500 12px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--brass); display: flex; gap: 10px; align-items: center; }
  h1 { margin: 0; font: 800 clamp(32px, 9vw, 42px)/1.04 var(--display); letter-spacing: -.02em; text-wrap: balance; }
  h2 { margin: 0; font: 700 22px/1.2 var(--display); }
  p { margin: 0; color: var(--muted); }
  .small { font-size: 13.5px; color: var(--dim); }
  .card { background: linear-gradient(var(--surface2), var(--surface)); border: 1px solid var(--line); border-top-color: #33343a; border-radius: 22px; padding: 18px; display: grid; gap: 10px; }
  .card.accent { background: linear-gradient(#1e170c, var(--brass-deep)); border-color: var(--brass-line); border-top-color: rgba(227,178,94,.5); }
  button { font: 600 16px/1 var(--body); height: 56px; border-radius: 18px; border: 0; cursor: pointer; width: 100%; color: var(--text); transition: transform .25s var(--ease); }
  button:active { transform: scale(.96); }
  .primary { position: relative; overflow: hidden; background: linear-gradient(var(--brass-hi), var(--brass)); color: var(--on-brass); box-shadow: 0 14px 30px -14px rgba(227,178,94,.6); }
  .primary::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,.45) 50%, transparent 65%); transform: translateX(-120%); animation: sheen 3.8s 1s ease-in-out infinite; }
  @keyframes sheen { 0%, 60% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
  .secondary { background: linear-gradient(var(--surface2), var(--surface)); border: 1.5px solid var(--line2); height: 54px; }
  .ghost { background: transparent; color: var(--brass); height: 48px; font-weight: 500; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--brass); outline-offset: 3px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  label { font-size: 13.5px; color: var(--muted); display: grid; gap: 6px; }
  input { font: 500 16px var(--body); color: var(--text); background: var(--surface); border: 1px solid var(--line2); border-radius: 14px; padding: 15px 14px; width: 100%; }
  .qr { position: relative; background: var(--text); border-radius: 22px; padding: 14px; width: min(268px, 100%); margin: 8px auto; }
  .qr svg { display: block; width: 100%; height: auto; }
  .mono { font: 500 15px var(--mono); color: var(--brass); }
  .chip { display: inline-block; white-space: nowrap; font: 500 15px var(--mono); color: var(--brass); background: var(--brass-deep); border: 1px solid var(--brass-line); border-radius: 10px; padding: 6px 10px; }
  .steps { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; counter-reset: s; }
  .steps li { display: grid; grid-template-columns: 26px 1fr; gap: 12px; color: var(--muted); font-size: 15px; counter-increment: s; }
  .steps li::before { content: counter(s); width: 26px; height: 26px; border-radius: 50%; background: var(--raised); color: var(--muted); display: grid; place-items: center; font: 500 13px var(--mono); }
  .appicon { width: 52px; height: 52px; border-radius: 15px; display: block; }
  .toast { position: fixed; z-index: 9; left: 16px; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom)); max-width: 28rem; margin: 0 auto; background: linear-gradient(#222328, var(--raised)); border: 1px solid #33343a; color: var(--text); border-radius: 18px; padding: 16px; transform: translateY(calc(100% + 60px)) scale(.9); visibility: hidden; transition: transform .45s cubic-bezier(.3,1.4,.5,1), visibility 0s .45s; }
  .toast.on { transform: none; visibility: visible; transition: transform .45s cubic-bezier(.3,1.4,.5,1); }
  [hidden] { display: none !important; }

  /* the vault dial mark */
  .dial { width: 120px; height: 120px; margin: 4px auto 0; display: block; }
  .dial .ticks { transform-origin: 60px 60px; animation: spin 90s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .dial .glow { animation: breathe 3.4s ease-in-out infinite; transform-origin: 66px 58px; }
  @keyframes breathe { 0%, 100% { opacity: .55; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.1); } }

  /* press and hold to hand over the key */
  .hold { position: relative; overflow: hidden; height: 64px; border-radius: 20px; background: var(--brass-deep); border: 1.5px solid var(--brass); color: var(--brass);
    display: flex; align-items: center; justify-content: center; gap: 10px; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .hold .fill { position: absolute; inset: 0; background: linear-gradient(90deg, var(--brass), var(--brass-hi)); transform-origin: left; transform: scaleX(var(--p, 0)); }
  .hold .label { position: relative; display: flex; gap: 10px; align-items: center; }
  .hold.over .label { color: var(--on-brass); }
  .hold .label svg { transition: transform .1s linear; transform: rotate(calc(var(--p, 0) * 90deg)); }
  .hold:not(.holding)::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 35%, rgba(227,178,94,.22) 50%, transparent 65%); transform: translateX(-120%); animation: sheen 2.6s ease-in-out infinite; }

  /* motion */
  @keyframes rise { from { opacity: 0; transform: translateY(18px); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes pop { 0% { opacity: 0; transform: scale(.6); } 70% { transform: scale(1.08); } 100% { opacity: 1; transform: none; } }
  @keyframes burst { from { transform: scale(.6); opacity: .9; } to { transform: scale(2.4); opacity: 0; } }
  @keyframes fly { 0% { transform: translate(-50%,-50%) rotate(-45deg) scale(1.1); } 30% { transform: translate(-50%,-40%) rotate(-30deg) scale(1.15); } 100% { transform: translate(110px,-260px) rotate(-60deg) scale(.4); opacity: 0; } }
  .rise > * { animation: rise .7s var(--ease) both; }
  .rise > *:nth-child(2) { animation-delay: .08s; } .rise > *:nth-child(3) { animation-delay: .16s; }
  .rise > *:nth-child(4) { animation-delay: .24s; } .rise > *:nth-child(5) { animation-delay: .32s; }
  .rise > *:nth-child(n+6) { animation-delay: .4s; }
  .done { position: relative; width: 240px; height: 200px; margin: 8px auto 0; display: grid; place-items: center; }
  .done canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .done .ring { position: absolute; width: 96px; height: 96px; border-radius: 50%; border: 2px solid var(--brass); animation: burst 1.2s .6s var(--ease) both; }
  .done .ring + .ring { border-width: 1px; animation-delay: .8s; }
  .done .badge { width: 96px; height: 96px; border-radius: 50%; background: var(--brass); display: grid; place-items: center; animation: pop .6s .55s cubic-bezier(.3,1.4,.5,1) both; }
  .done .flying { position: absolute; left: 50%; top: 50%; animation: fly 1.1s cubic-bezier(.65,0,.35,1) both; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<div class="toast" id="toast" role="status"></div>
<noscript><main><h1>Keyholder</h1><p>This page needs JavaScript to approve requests.</p></main></noscript>

<script src="qrcode.js"></script>
<script>
"use strict";
// ------------------------------------------------------------------ constants (must match the app)
const BASE = "https://aleballabio.github.io/keyholder/k";
const SIGN_PREFIX = "KH-A1.";
const APPROVAL_TTL = 15 * 60; // seconds
const ALPH = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const subtle = crypto.subtle;
const enc = new TextEncoder(), dec = new TextDecoder();

const $app = document.getElementById("app");
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const b64u = (bytes) => btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const unb64u = (s) => { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; return Uint8Array.from(atob(s), (c) => c.charCodeAt(0)); };
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

// iPhone Home Screen apps keep their own storage, separate from Safari, and links always open in Safari.
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isAndroid = /Android/i.test(navigator.userAgent);
const standalone = navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;

function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 3500);
}
const buzz = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

// The same antique brass key as the app: ringed bow with three lobes, collar, shaft, toothed bit.
let keyN = 0;
function BRASS_KEY(w, { bit = true } = {}) {
  const id = "kg" + (++keyN);
  return `<svg width="${w}" height="${Math.round(w * 0.42)}" viewBox="-3.2 -2.9 13.6 5.7" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="-2.4" x2="0.8" y2="2.6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbe3a6"/><stop offset=".3" stop-color="#e9bc68"/><stop offset=".65" stop-color="#c08a38"/><stop offset="1" stop-color="#7e5722"/></linearGradient></defs>
    <g fill="url(#${id})" stroke="#3e2a0e" stroke-width=".08">
      <circle cx="-0.975" cy="1.689" r=".78"/><circle cx="-1.95" cy="0" r=".78"/><circle cx="-0.975" cy="-1.689" r=".78"/>
      <path fill-rule="evenodd" d="M-2.1 0a2.1 2.1 0 1 0 4.2 0a2.1 2.1 0 1 0-4.2 0ZM-1.1 0a.95 .95 0 1 1 1.9 0a.95 .95 0 1 1-1.9 0Z"/>
      <rect x="1.6" y="-.42" width="8.4" height=".84" rx=".42"/><rect x="2.05" y="-.72" width=".5" height="1.44" rx=".18"/><rect x="2.85" y="-.6" width=".4" height="1.2" rx=".15"/>
      ${bit ? `<path d="M7.3 .2V2.5H7.85V1.8H8.35V2.5H8.95V2.05H9.55V.2Z"/>` : ""}
    </g>
    <path d="M3.3 -.26H9.4" stroke="#fff" stroke-opacity=".55" stroke-width=".13" stroke-linecap="round"/>
  </svg>`;
}

// The vault dial mark: brass ticks, dark face, glowing keyhole, the key going in.
function DIAL() {
  let ticks = "";
  for (let i = 0; i < 48; i++) {
    const a = (i * 7.5 - 90) * Math.PI / 180, major = i % 4 === 0, r1 = major ? 47 : 49.5, r2 = 55;
    ticks += `<line x1="${(60 + r1 * Math.cos(a)).toFixed(2)}" y1="${(60 + r1 * Math.sin(a)).toFixed(2)}" x2="${(60 + r2 * Math.cos(a)).toFixed(2)}" y2="${(60 + r2 * Math.sin(a)).toFixed(2)}" stroke="${major ? "#e3b25e" : "#4a3c22"}" stroke-width="${major ? 2.4 : 1.4}" stroke-linecap="round"/>`;
  }
  return `<svg class="dial" viewBox="0 0 120 120" aria-hidden="true">
    <defs><radialGradient id="dg"><stop offset="0" stop-color="#fff4da"/><stop offset=".45" stop-color="#f3cb82"/><stop offset="1" stop-color="#f3cb82" stop-opacity="0"/></radialGradient></defs>
    <g class="ticks">${ticks}</g>
    <circle cx="60" cy="60" r="42" fill="#100d09" stroke="#3a2e17"/>
    <circle class="glow" cx="66" cy="60" r="16" fill="url(#dg)" opacity=".7"/>
    <circle cx="66" cy="56" r="4.6" fill="#ffe9b8"/><path d="M63.4 58 61.9 69h8.2L68.6 58Z" fill="#f3cb82"/>
    <g transform="translate(25 56) scale(3.05)" fill="#e9bc68">
      <circle cx="-0.975" cy="1.689" r=".78"/><circle cx="-1.95" cy="0" r=".78"/><circle cx="-0.975" cy="-1.689" r=".78"/>
      <path fill-rule="evenodd" d="M-2.1 0a2.1 2.1 0 1 0 4.2 0a2.1 2.1 0 1 0-4.2 0ZM-1.1 0a.95 .95 0 1 1 1.9 0a.95 .95 0 1 1-1.9 0Z"/>
      <rect x="1.6" y="-.42" width="10.3" height=".84" rx=".42"/><rect x="2.05" y="-.72" width=".5" height="1.44" rx=".18"/>
    </g></svg>`;
}

function qrSvg(text) {
  const q = qrcode(0, "M"); q.addData(text, "Byte"); q.make();
  return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true, alt: "QR code" });
}

// A request may carry a tiny WebP of the app's icon (field "i"), so the keyholder sees it without having the app.
function appIcon(r) {
  if (typeof r.i !== "string" || r.i.length > 2400 || !/^[A-Za-z0-9_-]+$/.test(r.i)) return "";
  const b64 = r.i.replace(/-/g, "+").replace(/_/g, "/");
  return `<img class="appicon" alt="" src="data:image/webp;base64,${b64}" onerror="this.remove()">`;
}

// ------------------------------------------------------------------ key storage (IndexedDB, non-extractable)
function db() {
  return new Promise((ok, no) => {
    const r = indexedDB.open("keyholder", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("keys");
    r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
  });
}
async function idb(mode, fn) {
  const d = await db();
  return new Promise((ok, no) => {
    const tx = d.transaction("keys", mode); const st = tx.objectStore("keys");
    const req = fn(st); tx.oncomplete = () => ok(req && req.result); tx.onerror = () => no(tx.error);
  });
}
const loadKey = () => idb("readonly", (s) => s.get("holder"));
const saveKey = (kp) => idb("readwrite", (s) => s.put(kp, "holder"));
const dropKey = () => idb("readwrite", (s) => s.delete("holder"));

async function ensureKey() {
  let kp = await loadKey();
  if (!kp) {
    // The private key can sign but can never be read out, not even by this page.
    kp = await subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, false, ["sign", "verify"]);
    await saveKey(kp);
  }
  // Ask the browser not to clear this site's data on its own.
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  return kp;
}
async function spkiOf(kp) { return new Uint8Array(await subtle.exportKey("spki", kp.publicKey)); }
async function fingerprint(spki) {
  const h = new Uint8Array(await subtle.digest("SHA-256", spki));
  let s = ""; for (let i = 0; i < 8; i++) s += ALPH[h[i] % 32];
  return s.slice(0, 4) + "-" + s.slice(4);
}
const pref = (k) => { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } };
const setPref = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const myName = () => pref("kh-name");

// ------------------------------------------------------------------ link parsing
function parseFrag(f) {
  const parts = f.split(".");
  try {
    if (parts[0] === "r1" && parts.length === 2) {
      const r = JSON.parse(dec.decode(unb64u(parts[1])));
      if (!/^[0-9a-f]{16}$/.test(r.id) || !["window", "bonus", "detox", "handover"].includes(r.t) || !(r.m >= 1 && r.m <= 240)) return { kind: "bad" };
      // A handover carries the new keyholder's public key.
      if (r.t === "handover" && !/^[A-Za-z0-9_-]{100,170}$/.test(r.a || "")) return { kind: "bad" };
      return { kind: "request", r };
    }
    if (parts[0] === "p1" || parts[0] === "a1") return { kind: "app", frag: f, what: parts[0] };
  } catch (e) { return { kind: "bad" }; }
  return f ? { kind: "bad" } : { kind: "home" };
}
const parseHash = () => parseFrag(decodeURIComponent(location.hash.slice(1)));

function openInApp(frag) {
  // Chrome intent link: opens Keyholder if installed (Android only).
  location.href = "intent://k#" + frag + "#Intent;scheme=keyholder;package=dev.keyholder;end";
}

async function shareOrCopy(text, title) {
  if (navigator.share) { try { await navigator.share({ title, text }); return; } catch (e) { if (e.name === "AbortError") return; } }
  try { await navigator.clipboard.writeText(text); toast("Copied. Paste it into your chat."); }
  catch (e) { prompt("Copy this:", text); }
}

// Paste a request that arrived in a chat. On iPhone this is how requests reach the Home Screen app.
async function pasteRequest() {
  let text = "";
  try { text = await navigator.clipboard.readText(); } catch (e) {}
  if (!/#r1\.|^r1\./.test(text)) text = prompt("Paste the request link from the chat:") || "";
  const m = text.match(/(?:#)?(r1\.[A-Za-z0-9_%-]+)/);
  if (!m) { if (text) toast("That isn't a Keyholder request link."); return; }
  location.hash = m[1];
}

// ------------------------------------------------------------------ hold to hand over the key
function holdButton(el, onDone, holdMs = 900) {
  let start = 0, raf = 0, done = false, ticks = 0;
  const set = (p) => { el.style.setProperty("--p", p.toFixed(3)); el.classList.toggle("over", p > .5); };
  const frame = (t) => {
    const p = Math.min(1, (t - start) / holdMs);
    set(p);
    const step = Math.floor(p * 8); if (step > ticks) { ticks = step; buzz(8); }
    if (p >= 1) { done = true; el.classList.remove("holding"); buzz(30); onDone(); return; }
    raf = requestAnimationFrame(frame);
  };
  const down = (e) => {
    if (done || e.button > 0) return;
    e.preventDefault(); try { el.setPointerCapture(e.pointerId); } catch (_) {}
    el.classList.add("holding"); ticks = 0; start = performance.now(); raf = requestAnimationFrame(frame);
    el.querySelector(".text").textContent = "Keep holding…";
  };
  const up = () => {
    if (done) return;
    cancelAnimationFrame(raf); el.classList.remove("holding"); set(0);
    el.querySelector(".text").textContent = el.dataset.label;
  };
  el.addEventListener("pointerdown", down);
  ["pointerup", "pointercancel", "pointerleave"].forEach((ev) => el.addEventListener(ev, up));
  el.addEventListener("contextmenu", (e) => e.preventDefault());
  // Keyboard and screen readers: a normal press works.
  el.addEventListener("click", (e) => { if (e.detail === 0 && !done) { done = true; onDone(); } });
}

// ------------------------------------------------------------------ sparks for "it worked"
function sparks(canvas) {
  if (reduceMotion) return;
  const dpr = devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const g = canvas.getContext("2d"); g.scale(dpr, dpr);
  const parts = Array.from({ length: 48 }, () => ({ a: Math.random() * Math.PI * 2, v: .45 + Math.random() * .65, s: 2 + Math.random() * 3, tw: Math.random() }));
  const t0 = performance.now() + 600, dur = 1700;
  const frame = (t) => {
    const k = (t - t0) / dur;
    g.clearRect(0, 0, w, h);
    if (k >= 1) return;
    if (k > 0) {
      const e = 1 - Math.pow(1 - k, 4), reach = Math.min(w, h) * .6;
      for (const p of parts) {
        const d = reach * p.v * e, x = w / 2 + Math.cos(p.a) * d, y = h / 2 + Math.sin(p.a) * d + 90 * k * k;
        const tail = 10 * (1 - k);
        g.strokeStyle = `rgba(227,178,94,${Math.max(0, (1 - k) * (.6 + .4 * Math.sin(k * 20 + p.tw * 6)))})`;
        g.lineWidth = p.s * (1 - k * .6); g.lineCap = "round";
        g.beginPath(); g.moveTo(x - Math.cos(p.a) * tail, y - Math.sin(p.a) * tail); g.lineTo(x, y); g.stroke();
      }
    }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

// ------------------------------------------------------------------ views
function viewInstall() {
  // iPhone Safari, no key yet: the key should live in the Home Screen app, which Safari's cleanup can't touch.
  $app.innerHTML = `
    <div class="rise" style="display:grid;gap:18px">
      ${DIAL()}
      <div class="eyebrow">Keyholder · iPhone</div>
      <h1>Put Keyholder on your Home Screen.</h1>
      <p>Keep your key in a Home Screen app. Safari can't clear it there.</p>
      <div class="card"><ol class="steps">
        <li>Tap the Share button <span class="mono">⬆︎</span> at the bottom of Safari.</li>
        <li>Choose <b>Add to Home Screen</b>, then <b>Add</b>.</li>
        <li>Open Keyholder from your Home Screen and set up your key there.</li></ol></div>
      <button class="ghost" id="anyway" style="color:var(--dim)">Use Safari instead</button>
    </div>`;
  $("anyway").onclick = () => { setPref("kh-safari-ok", "1"); viewHome(); };
}

async function viewHome() {
  if (isIOS && !standalone && !pref("kh-safari-ok") && !(await loadKey())) return viewInstall();
  const kp = await ensureKey();
  const spki = await spkiOf(kp);
  const fp = await fingerprint(spki);
  const name = myName();
  const link = () => `${BASE}#p1.${b64u(spki)}.${b64u(enc.encode((myName() || "Your keyholder").slice(0, 40)))}`;
  $app.innerHTML = `
    <div class="rise" style="display:grid;gap:18px">
      <div class="eyebrow">${BRASS_KEY(34, { bit: false })} You hold the key</div>
      <h1>Holding the key.</h1>
      <button class="primary" id="paste">Paste a request</button>
      <p class="small" style="margin-top:-8px">Copy a request link from your chat, then tap Paste. Or tap the link.</p>
      <label>Your name, as they'll see it<input id="name" value="${esc(name)}" maxlength="40" placeholder="Marco" autocomplete="given-name"></label>
      <div class="card"><p>Have them scan this code with their camera.</p><div class="qr" id="qr"></div>
        <div style="display:flex;gap:10px;align-items:center"><span class="chip">${fp}</span><p class="small">Your key's fingerprint. It should match the one on their phone.</p></div></div>
      <button class="secondary" id="send">Send key link</button>
      <div class="card"><div class="eyebrow">How approving works</div>
        <ol class="steps"><li>They send you a request link.</li><li>${isIOS && standalone ? "Copy it, then tap Paste a request here." : "Tap it to open it here."}</li><li>Hold to approve, then send the reply. It works once, within 15 minutes.</li></ol></div>
      <p class="small">${isIOS && standalone ? "Your key stays in this Home Screen app. Deleting the app deletes the key, and you'd need to pair again." : "Use this page in one browser only. Clearing its site data deletes the key, and you'd need to pair again."}</p>
      <button class="ghost" id="reset" style="color:var(--dim)">Delete my key</button>
    </div>`;
  const draw = () => { $("qr").innerHTML = qrSvg(link()); };
  draw();
  $("name").addEventListener("input", (e) => { setPref("kh-name", e.target.value.trim()); draw(); });
  $("paste").onclick = pasteRequest;
  $("send").onclick = () => shareOrCopy(`My Keyholder key. Tap to pair:\n${link()}`, "My Keyholder key");
  $("reset").onclick = async () => {
    if (!confirm("Delete your key? Requests can't be approved here until you pair again.")) return;
    await dropKey(); toast("Key deleted."); viewHome();
  };
}

function describe(r, fp) {
  if (r.t === "window") return { title: `${r.m}-minute window`, sub: `For ${r.m} minutes they can change any limit and use any app.` };
  if (r.t === "bonus") return { title: `+${r.m} minutes of ${esc(r.al || "one app")}`, sub: "Only that app, only this once." };
  if (r.t === "handover") {
    const who = esc(r.al || "the new keyholder");
    return { title: `Give their key to ${esc(r.al || "someone else")}`,
      sub: `You stop holding their key. Only ${who} can approve after this.</p><p class="small"><span class="chip">${fp}</span> New key. Check it with ${who}.` };
  }
  return { title: "End their break early", sub: "Their detox or break ends now." };
}

async function viewRequest(r) {
  const kp = await loadKey();
  const d = describe(r, r.t === "handover" ? await fingerprint(unb64u(r.a)) : "");
  const icon = r.t === "bonus" ? appIcon(r) : "";
  if (!kp) {
    const iphone = isIOS && !standalone;
    $app.innerHTML = `<div class="rise" style="display:grid;gap:18px">
      <div class="eyebrow">${BRASS_KEY(34, { bit: false })} Keyholder</div>
      <h1>${esc(r.f || "Someone")} is asking for the key.</h1>
      <div class="card accent">${icon}<h2>${d.title}</h2>${r.n ? `<p>“${esc(r.n)}”</p>` : ""}</div>
      ${iphone ? `
        <p>Your key lives in the Keyholder app on your Home Screen.</p>
        <button class="primary" id="copy">Copy request</button>
        <div class="card"><ol class="steps"><li>Tap Copy request above.</li><li>Open Keyholder from your Home Screen.</li><li>Tap Paste a request, then hold to hand over the key.</li></ol></div>
        <button class="ghost" id="setup" style="color:var(--dim)">No Home Screen app yet? Set up</button>`
      : `
        <p>This browser has no key yet. Using the Keyholder app? Open this link on that phone. Otherwise, set up this browser and pair with them first.</p>
        ${isAndroid ? `<button class="primary" id="app">Open in app</button>` : ""}
        <button class="secondary" id="setup">Set up browser</button>`}
      </div>`;
    if ($("copy")) $("copy").onclick = async () => {
      try { await navigator.clipboard.writeText(location.href); toast("Copied. Now open Keyholder from your Home Screen."); }
      catch (e) { prompt("Copy this request:", location.href); }
    };
    if ($("app")) $("app").onclick = () => openInApp(location.hash.slice(1));
    $("setup").onclick = () => { history.replaceState(null, "", location.pathname); iphone ? viewInstall() : viewHome(); };
    return;
  }
  $app.innerHTML = `<div class="rise" style="display:grid;gap:18px">
    <div class="eyebrow">${BRASS_KEY(34, { bit: false })} You hold the key</div>
    <h1>${esc(r.f || "Someone")} is asking for the key.</h1>
    <div class="card accent">${icon}<h2>${d.title}</h2>${r.n ? `<p>“${esc(r.n)}”</p>` : ""}<p class="small">${d.sub}</p></div>
    <p class="small">Your approval works for this request only.</p>
    <button class="hold" id="ok" data-label="Hold to hand over the key"><span class="fill"></span>
      <span class="label">${BRASS_KEY(30, { bit: false })}<span class="text">Hold to hand over the key</span></span></button>
    <div class="row"><button class="secondary" id="no">Not now</button>${r.t !== "detox" && r.m > 15 ? `<button class="secondary" id="short">Only 15 min</button>` : ""}</div></div>`;
  const approve = async (minutes) => {
    const a = { v: 1, id: r.id, t: r.t, m: Math.min(minutes, r.m), a: r.a || "", x: Math.floor(Date.now() / 1000) + APPROVAL_TTL };
    const payload = b64u(enc.encode(JSON.stringify(a)));
    const sig = new Uint8Array(await subtle.sign({ name: "ECDSA", hash: "SHA-256" }, kp.privateKey, enc.encode(SIGN_PREFIX + payload)));
    viewApproved(`${BASE}#a1.${payload}.${b64u(sig)}`, r, a.m);
  };
  holdButton($("ok"), () => approve(r.m));
  const s = $("short"); if (s) s.onclick = () => approve(15);
  $("no").onclick = () => {
    $app.innerHTML = `<div class="rise" style="display:grid;gap:14px;text-align:center;padding-top:24vh">
      <div style="font-size:0">${BRASS_KEY(90, { bit: true })}</div><h1>Key kept.</h1><p>Nothing was sent. Their limits stay the same.</p></div>`;
  };
}

function viewApproved(link, r, minutes) {
  $app.innerHTML = `<div style="display:grid;gap:18px">
    <div class="done" aria-hidden="true"><canvas id="sp"></canvas><span class="ring"></span><span class="ring"></span>
      <span class="badge"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#120e06" stroke-width="2.6" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg></span>
      <span class="flying">${BRASS_KEY(110)}</span></div>
    <div class="rise" style="display:grid;gap:18px">
      <h1 style="text-align:center">Approved.</h1>
      <p style="text-align:center">Send it to ${esc(r.f || "them")}. It works once and must be opened within 15 minutes.</p>
      <button class="primary" id="send">Send reply</button>
      <button class="secondary" id="together">Show code</button>
      <div class="qr" id="qr" hidden></div>
      <button class="ghost" id="home" style="color:var(--dim)">Done</button></div></div>`;
  sparks($("sp"));
  $("send").onclick = () => shareOrCopy(`Approved. Tap to open:\n${link}`, "Keyholder reply");
  $("together").onclick = () => { const q = $("qr"); q.innerHTML = qrSvg(link); q.hidden = !q.hidden; };
  $("home").onclick = () => { history.replaceState(null, "", location.pathname); viewHome(); };
}

function viewForApp(frag, what) {
  const title = what === "p1" ? "This is a key link." : "This is a reply for Keyholder.";
  $app.innerHTML = `<div class="rise" style="display:grid;gap:18px;padding-top:10vh">
    ${DIAL()}
    <h1>${title}</h1>
    <p>Open it on the phone that's being locked. ${isAndroid ? "If Keyholder is installed there, it opens right away." : "Send it to that phone, then tap it there."}</p>
    ${isAndroid ? `<button class="primary" id="open">Open in Keyholder</button>` : ""}
    <p class="small">Didn't open? In Keyholder, paste the link into the field for it.</p>
    <button class="secondary" id="copy">Copy link</button></div>`;
  if ($("open")) $("open").onclick = () => openInApp(frag);
  $("copy").onclick = () => shareOrCopy(location.href, "Keyholder link");
}

function viewBad() {
  $app.innerHTML = `<div class="rise" style="display:grid;gap:18px;padding-top:20vh"><h1>That link looks damaged.</h1>
    <p>Ask them to send it again. Links must arrive in one piece, without spaces or line breaks.</p>
    <button class="secondary" id="home">Go to my key</button></div>`;
  $("home").onclick = () => { history.replaceState(null, "", location.pathname); viewHome(); };
}

async function route() {
  if (!window.crypto || !crypto.subtle || !window.indexedDB) {
    $app.innerHTML = `<h1>This browser can't hold a key.</h1><p>Open this page in an up-to-date Chrome, Safari or Firefox.</p>`;
    return;
  }
  const h = parseHash();
  try {
    if (h.kind === "request") await viewRequest(h.r);
    else if (h.kind === "app") viewForApp(h.frag, h.what);
    else if (h.kind === "bad") viewBad();
    else await viewHome();
  } catch (e) {
    $app.innerHTML = `<h1>Something went wrong.</h1><p>${esc(e.message || e)}</p>`;
  }
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
