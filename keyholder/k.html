<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>Keyholder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* One narrow column on OLED black with a single brass accent, matching the Keyholder app. */
  :root {
    --bg: #000; --surface: #0e0f11; --raised: #1a1b1e; --line: #222327; --line2: #2a2b2f;
    --text: #f2efe8; --muted: #b9b5ac; --dim: #8d897f;
    --brass: #e3b25e; --brass-deep: #15110a; --brass-line: #3a2e17; --on-brass: #120e06; --ok: #6fcf97;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 16px/1.55 var(--body); }
  main { max-width: 30rem; margin: 0 auto; padding: calc(28px + env(safe-area-inset-top)) 22px calc(40px + env(safe-area-inset-bottom)); display: grid; gap: 18px; }
  .eyebrow { font: 500 12px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--brass); display: flex; gap: 10px; align-items: center; }
  h1 { margin: 0; font: 800 clamp(32px, 9vw, 42px)/1.04 var(--display); letter-spacing: -.02em; text-wrap: balance; }
  h2 { margin: 0; font: 700 22px/1.2 var(--display); }
  p { margin: 0; color: var(--muted); }
  .small { font-size: 13.5px; color: var(--dim); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px; display: grid; gap: 10px; }
  .card.accent { background: var(--brass-deep); border-color: var(--brass-line); }
  button { font: 600 16px/1 var(--body); height: 56px; border-radius: 18px; border: 0; cursor: pointer; width: 100%; }
  .primary { background: var(--brass); color: var(--on-brass); }
  .secondary { background: transparent; color: var(--text); border: 1.5px solid var(--line2); height: 52px; }
  .ghost { background: transparent; color: var(--brass); height: 48px; font-weight: 500; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--brass); outline-offset: 3px; }
  button:active { transform: scale(.98); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  label { font-size: 13.5px; color: var(--muted); display: grid; gap: 6px; }
  input { font: 500 16px var(--body); color: var(--text); background: var(--surface); border: 1px solid var(--line2); border-radius: 14px; padding: 15px 14px; width: 100%; }
  .qr { background: var(--text); border-radius: 22px; padding: 14px; width: min(268px, 100%); margin: 0 auto; }
  .qr svg { display: block; width: 100%; height: auto; }
  .mono { font: 500 15px var(--mono); color: var(--brass); }
  .steps { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; counter-reset: s; }
  .steps li { display: grid; grid-template-columns: 26px 1fr; gap: 12px; color: var(--muted); font-size: 15px; counter-increment: s; }
  .steps li::before { content: counter(s); width: 26px; height: 26px; border-radius: 50%; background: var(--raised); color: var(--muted); display: grid; place-items: center; font: 500 13px var(--mono); }
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom)); max-width: 28rem; margin: 0 auto; background: var(--raised); color: var(--text); border-radius: 16px; padding: 16px; transform: translateY(calc(100% + 60px)); visibility: hidden; transition: transform .35s cubic-bezier(.2,.8,.2,1), visibility 0s .35s; }
  .toast.on { transform: none; visibility: visible; transition: transform .35s cubic-bezier(.2,.8,.2,1); }
  [hidden] { display: none !important; }

  /* motion */
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes pop { 0% { opacity: 0; transform: scale(.6); } 70% { transform: scale(1.08); } 100% { opacity: 1; transform: none; } }
  @keyframes burst { from { transform: scale(.6); opacity: .9; } to { transform: scale(2.4); opacity: 0; } }
  @keyframes fly { 0% { transform: translate(0,0) rotate(0) scale(1.1); } 30% { transform: translate(0,8px) rotate(15deg) scale(1.15); } 100% { transform: translate(160px,-240px) rotate(-45deg) scale(.4); opacity: 0; } }
  @keyframes draw { from { stroke-dashoffset: 60; } to { stroke-dashoffset: 0; } }
  .rise > * { animation: rise .6s cubic-bezier(.2,.8,.2,1) both; }
  .rise > *:nth-child(2) { animation-delay: .08s; } .rise > *:nth-child(3) { animation-delay: .16s; }
  .rise > *:nth-child(4) { animation-delay: .24s; } .rise > *:nth-child(5) { animation-delay: .32s; }
  .rise > *:nth-child(n+6) { animation-delay: .4s; }
  .hero-key path, .hero-key circle { stroke-dasharray: 60; animation: draw 1.2s .2s cubic-bezier(.2,.8,.2,1) both; }
  .done { position: relative; width: 120px; height: 120px; margin: 16px auto 0; display: grid; place-items: center; }
  .done .ring { position: absolute; inset: 12px; border-radius: 50%; border: 2px solid var(--brass); animation: burst 1.2s .6s cubic-bezier(.2,.8,.2,1) both; }
  .done .ring + .ring { border-width: 1px; animation-delay: .8s; }
  .done .badge { width: 96px; height: 96px; border-radius: 50%; background: var(--brass); display: grid; place-items: center; animation: pop .6s .55s cubic-bezier(.3,1.4,.5,1) both; }
  .done .flying { position: absolute; animation: fly 1.1s cubic-bezier(.65,0,.35,1) both; }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<div class="toast" id="toast" role="status"></div>
<noscript><main><h1>Keyholder</h1><p>This page needs JavaScript to approve requests.</p></main></noscript>

<script src="qrcode.js"></script>
<script>
"use strict";
// ------------------------------------------------------------------ constants (must match the app)
const BASE = "https://aleballabio.github.io/keyholder/k";
const SIGN_PREFIX = "KH-A1.";
const APPROVAL_TTL = 15 * 60; // seconds
const ALPH = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const subtle = crypto.subtle;
const enc = new TextEncoder(), dec = new TextDecoder();

const $app = document.getElementById("app");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const b64u = (bytes) => btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const unb64u = (s) => { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; return Uint8Array.from(atob(s), (c) => c.charCodeAt(0)); };

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 3500);
}

const KEY_SVG = (size, color = "#e3b25e", cls = "") =>
  `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3 20 3"/><path d="m16 7 3 3"/><path d="m18 5 2 2"/></svg>`;

function qrSvg(text) {
  const q = qrcode(0, "M"); q.addData(text, "Byte"); q.make();
  return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true, alt: "QR code" });
}

// ------------------------------------------------------------------ key storage (IndexedDB, non-extractable)
function db() {
  return new Promise((ok, no) => {
    const r = indexedDB.open("keyholder", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("keys");
    r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
  });
}
async function idb(mode, fn) {
  const d = await db();
  return new Promise((ok, no) => {
    const tx = d.transaction("keys", mode); const st = tx.objectStore("keys");
    const req = fn(st); tx.oncomplete = () => ok(req && req.result); tx.onerror = () => no(tx.error);
  });
}
const loadKey = () => idb("readonly", (s) => s.get("holder"));
const saveKey = (kp) => idb("readwrite", (s) => s.put(kp, "holder"));
const dropKey = () => idb("readwrite", (s) => s.delete("holder"));

async function ensureKey() {
  let kp = await loadKey();
  if (!kp) {
    // The private key can sign but can never be read out, not even by this page.
    kp = await subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, false, ["sign", "verify"]);
    await saveKey(kp);
  }
  return kp;
}
async function spkiOf(kp) { return new Uint8Array(await subtle.exportKey("spki", kp.publicKey)); }
async function fingerprint(spki) {
  const h = new Uint8Array(await subtle.digest("SHA-256", spki));
  let s = ""; for (let i = 0; i < 8; i++) s += ALPH[h[i] % 32];
  return s.slice(0, 4) + "-" + s.slice(4);
}
const myName = () => { try { return localStorage.getItem("kh-name") || ""; } catch (e) { return ""; } };
const setName = (v) => { try { localStorage.setItem("kh-name", v); } catch (e) {} };

// ------------------------------------------------------------------ link parsing
function parseHash() {
  const f = decodeURIComponent(location.hash.slice(1));
  const parts = f.split(".");
  try {
    if (parts[0] === "r1" && parts.length === 2) {
      const r = JSON.parse(dec.decode(unb64u(parts[1])));
      if (!/^[0-9a-f]{16}$/.test(r.id) || !["window", "bonus", "detox"].includes(r.t) || !(r.m >= 1 && r.m <= 240)) return { kind: "bad" };
      return { kind: "request", r };
    }
    if (parts[0] === "p1" || parts[0] === "a1") return { kind: "app", frag: f, what: parts[0] };
  } catch (e) { return { kind: "bad" }; }
  return f ? { kind: "bad" } : { kind: "home" };
}

function openInApp(frag) {
  // Chrome intent link: opens Keyholder if installed.
  location.href = "intent://k#" + frag + "#Intent;scheme=keyholder;package=dev.keyholder;end";
}

async function shareOrCopy(text, title) {
  if (navigator.share) { try { await navigator.share({ title, text }); return; } catch (e) { if (e.name === "AbortError") return; } }
  try { await navigator.clipboard.writeText(text); toast("Copied. Paste it into your chat."); }
  catch (e) { prompt("Copy this:", text); }
}

// ------------------------------------------------------------------ views
async function viewHome() {
  const kp = await ensureKey();
  const spki = await spkiOf(kp);
  const fp = await fingerprint(spki);
  const name = myName();
  const link = () => `${BASE}#p1.${b64u(spki)}.${b64u(enc.encode((myName() || "Your keyholder").slice(0, 40)))}`;
  $app.innerHTML = `
    <div class="rise" style="display:grid;gap:18px">
      <div class="eyebrow">${KEY_SVG(16)} Keyholder · web</div>
      <h1>You hold the key.</h1>
      <p>This browser keeps your key. It can approve requests but can never be copied out, not even by this page.</p>
      <label>Your name, as they'll see it<input id="name" value="${esc(name)}" maxlength="40" placeholder="Marco" autocomplete="given-name"></label>
      <div class="card"><p>Together: they point their phone's camera at this code.</p><div class="qr" id="qr"></div>
        <p class="small">Key fingerprint <span class="mono">${fp}</span>. It shows on their phone too, so you can check it matches.</p></div>
      <button class="secondary" id="send">Far apart: send my key</button>
      <div class="card"><div class="eyebrow">How approving works</div>
        <ol class="steps"><li>They send you a request link through any messenger.</li><li>Tap it. This page opens with Approve or Not now.</li><li>Approve, then send the reply back. It works once and expires in 15 minutes.</li></ol></div>
      <p class="small">Use this page in one browser only, and don't clear its site data, or the key is lost. You'd then pair again with their OK.</p>
      <button class="ghost" id="reset" style="color:var(--dim)">Delete my key from this browser</button>
    </div>`;
  const draw = () => { document.getElementById("qr").innerHTML = qrSvg(link()); };
  draw();
  document.getElementById("name").addEventListener("input", (e) => { setName(e.target.value.trim()); draw(); });
  document.getElementById("send").onclick = () => shareOrCopy(`My Keyholder key. Tap to pair:\n${link()}`, "My Keyholder key");
  document.getElementById("reset").onclick = async () => {
    if (!confirm("Delete your key? Requests can't be approved from this browser until you pair again.")) return;
    await dropKey(); toast("Key deleted."); viewHome();
  };
}

function describe(r) {
  if (r.t === "window") return { title: `${r.m}-minute window`, sub: `For ${r.m} minutes they can change any limit and use any app.` };
  if (r.t === "bonus") return { title: `+${r.m} minutes of ${esc(r.al || "one app")}`, sub: "Only that app, only this once." };
  return { title: "End their break early", sub: "Their detox or break ends now." };
}

async function viewRequest(r) {
  const kp = await loadKey();
  const d = describe(r);
  if (!kp) {
    $app.innerHTML = `<div class="rise" style="display:grid;gap:18px">
      <div class="eyebrow">${KEY_SVG(16)} Keyholder</div>
      <h1>${esc(r.f || "Someone")} is asking for the key.</h1>
      <div class="card"><h2>${d.title}</h2></div>
      <p>This browser doesn't hold a key yet. If you use the Keyholder app, open this link on that phone instead. Otherwise set up this page as their keyholder first. They'll need to pair with it.</p>
      <button class="primary" id="app">Open in the Keyholder app</button>
      <button class="secondary" id="setup">Set up this browser</button></div>`;
    document.getElementById("app").onclick = () => openInApp(location.hash.slice(1));
    document.getElementById("setup").onclick = () => { history.replaceState(null, "", location.pathname); viewHome(); };
    return;
  }
  $app.innerHTML = `<div class="rise" style="display:grid;gap:18px">
    <div class="eyebrow">${KEY_SVG(16)} You hold the key</div>
    <h1>${esc(r.f || "Someone")} is asking for the key.</h1>
    <div class="card"><h2>${d.title}</h2>${r.n ? `<p>“${esc(r.n)}”</p>` : ""}<p class="small">${d.sub}</p></div>
    <p class="small">Approving signs this one request with the key in this browser. It can't be reused.</p>
    <button class="primary" id="ok">Hand over the key</button>
    <div class="row"><button class="secondary" id="no">Not now</button>${r.t !== "detox" && r.m > 15 ? `<button class="secondary" id="short">Only 15 min</button>` : ""}</div></div>`;
  const approve = async (minutes) => {
    const a = { v: 1, id: r.id, t: r.t, m: Math.min(minutes, r.m), a: r.a || "", x: Math.floor(Date.now() / 1000) + APPROVAL_TTL };
    const payload = b64u(enc.encode(JSON.stringify(a)));
    const sig = new Uint8Array(await subtle.sign({ name: "ECDSA", hash: "SHA-256" }, kp.privateKey, enc.encode(SIGN_PREFIX + payload)));
    viewApproved(`${BASE}#a1.${payload}.${b64u(sig)}`, r);
  };
  document.getElementById("ok").onclick = () => approve(r.m);
  const s = document.getElementById("short"); if (s) s.onclick = () => approve(15);
  document.getElementById("no").onclick = () => {
    $app.innerHTML = `<div class="rise" style="display:grid;gap:14px;text-align:center;padding-top:30vh"><h1>Key kept.</h1><p>Nothing is sent. Their limits stay as they are.</p></div>`;
  };
}

function viewApproved(link, r) {
  $app.innerHTML = `<div style="display:grid;gap:18px">
    <div class="done" aria-hidden="true"><span class="ring"></span><span class="ring"></span>
      <span class="badge"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#120e06" stroke-width="2.6" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg></span>
      <span class="flying">${KEY_SVG(60)}</span></div>
    <div class="rise" style="display:grid;gap:18px;animation-delay:.6s">
      <h1 style="text-align:center">Key ready to send.</h1>
      <p style="text-align:center">Send the reply to ${esc(r.f || "them")}. Once they tap it, it works for 15 minutes.</p>
      <button class="primary" id="send">Send the reply</button>
      <button class="secondary" id="together">We're together: show a code</button>
      <div class="qr" id="qr" hidden></div></div></div>`;
  document.getElementById("send").onclick = () => shareOrCopy(`Here's the key:\n${link}`, "Keyholder reply");
  document.getElementById("together").onclick = () => { const q = document.getElementById("qr"); q.innerHTML = qrSvg(link); q.hidden = !q.hidden; };
}

function viewForApp(frag, what) {
  const title = what === "p1" ? "This is a key link." : "This is a reply for Keyholder.";
  $app.innerHTML = `<div class="rise" style="display:grid;gap:18px;padding-top:12vh">
    <div class="eyebrow">${KEY_SVG(16, "#e3b25e", "hero-key")} Keyholder</div>
    <h1>${title}</h1>
    <p>Open it on the phone that's being locked. If Keyholder is installed there, it opens right away.</p>
    <button class="primary" id="open">Open in Keyholder</button>
    <p class="small">Didn't open? In Keyholder, paste the link into the field for it.</p>
    <button class="secondary" id="copy">Copy link</button></div>`;
  document.getElementById("open").onclick = () => openInApp(frag);
  document.getElementById("copy").onclick = () => shareOrCopy(location.href, "Keyholder link");
}

function viewBad() {
  $app.innerHTML = `<div class="rise" style="display:grid;gap:18px;padding-top:20vh"><h1>That link looks damaged.</h1>
    <p>Ask them to send it again. Links must arrive in one piece, without spaces or line breaks.</p>
    <button class="secondary" id="home">Go to my key</button></div>`;
  document.getElementById("home").onclick = () => { history.replaceState(null, "", location.pathname); viewHome(); };
}

async function route() {
  if (!window.crypto || !crypto.subtle || !window.indexedDB) {
    $app.innerHTML = `<h1>This browser can't hold a key.</h1><p>Open this page in an up-to-date Chrome, Safari or Firefox.</p>`;
    return;
  }
  const h = parseHash();
  try {
    if (h.kind === "request") await viewRequest(h.r);
    else if (h.kind === "app") viewForApp(h.frag, h.what);
    else if (h.kind === "bad") viewBad();
    else await viewHome();
  } catch (e) {
    $app.innerHTML = `<h1>Something went wrong.</h1><p>${esc(e.message || e)}</p>`;
  }
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
